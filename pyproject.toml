[project]
name = "myanmar-weather-forecast"
version = "0.1.0"
description = "AI-powered 7-day weather forecast for Myanmar using Earth2Studio + Aurora 1.5"
requires-python = ">=3.11"
dependencies = [
    "earth2studio[aurora,data]>=0.17.0",
    "xarray>=2024.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "zarr>=2.17.0",
    "netcdf4>=1.6.0",
    "cfgrib>=0.9.10",
    "eccodes>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
